name: Java CI with Maven

on:
  push: # Se ejecuta en todas las ramas existentes y nuevas
  pull_request:
    branches: [ "develop", "sprint/0-fundacion" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v3

    - name: Set up JDK 25
      uses: actions/setup-java@v3
      with:
        java-version: '25'
        distribution: 'temurin'
        cache: maven

    # Paso nuevo: Verifica el estilo de código antes de compilar
    - name: Checkstyle Validation
      run: mvn checkstyle:check

    - name: Build and Test with Maven
      # Eliminamos -DskipTests para que tus pruebas con H2 se ejecuten en el CI
      run: mvn -B package --file pom.xml