<!doctype html>
<html lang="es" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Departamentos — C.E.N. Roraima</title>
    <link rel="stylesheet" href="../css/styles.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Lora:wght@600;700&family=Source+Sans+3:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
  </head>

  <body>
    <!-- Barra superior -->
    <header class="topbar">
      <a class="topbar-brand" href="dashboard.html">
        <img
          src="../img/logo.svg.png"
          alt="Logo C.E.N. Roraima"
          onerror="this.style.display = 'none'"
        />
        <div class="topbar-brand-text">
          <strong>C.E.N. Roraima</strong>
          <span>Control de asistencia</span>
        </div>
      </a>
      <div class="topbar-right">
        <a href="dashboard.html" class="btn-back">← Dashboard</a>
        <a
          href="../index.html"
          class="btn-logout"
          onclick="
            logout();
            return false;
          "
        >
          Cerrar sesión
        </a>
      </div>
    </header>

    <main class="mod-main">
      <!-- Encabezado de página -->
      <div class="mod-heading">
        <div>
          <h1>Departamentos</h1>
        </div>
        <!-- Botón para abrir el formulario de creación -->
        <button class="btn-primary" onclick="abrirModal()">+ Agregar</button>
      </div>

      <!-- Tarjetas de departamentos -->
      <div class="deptos-grid" id="deptos-grid">
        <!-- Se llena dinámicamente por departamentos.js -->
        <div class="tabla-empty">
          <!--<span>🏢</span> -->
          <!--Cargando departamentos… -->
        </div>
      </div>

      <!-- Tabla de departamentos para verlos en detalle -->
      <section class="tabla-panel">
        <div class="tabla-header">
          <h2>Listado de áreas</h2>
          <span class="tabla-count" id="tabla-count">0 áreas</span>
        </div>

        <div class="tabla-container">
          <table id="tabla-deptos">
            <thead>
              <tr>
                <th>Nombre del área</th>
                <th>Descripción</th>
                <th>Personal asignado</th>
                <th>Acciones</th>
              </tr>
            </thead>
            <tbody id="tbody-deptos">
              <!-- Se llena dinámicamente -->
            </tbody>
          </table>
        </div>
      </section>
    </main>

    <!-- ── Modal: crear / editar departamento ── -->
    <div class="modal-overlay" id="modal-overlay" onclick="cerrarModal()"></div>

    <div
      class="modal"
      id="modal-depto"
      role="dialog"
      aria-modal="true"
      aria-labelledby="modal-titulo"
    >
      <div class="modal-header">
        <h3 id="modal-titulo">Agregar departamento</h3>
        <button class="modal-close" onclick="cerrarModal()" aria-label="Cerrar">
          ✕
        </button>
      </div>

      <div class="modal-body">
        <!-- Id oculto para saber si es edición -->
        <input type="hidden" id="form-id" />

        <label>
          Nombre del área
          <input
            type="text"
            id="form-nombre"
            placeholder="Ej: Coordinación académica"
          />
        </label>

        <label>
          Descripción
          <textarea
            id="form-descripcion"
            rows="3"
            placeholder="Breve descripción del área…"
          ></textarea>
        </label>

        <!-- Mensaje de error interno del modal -->
        <p id="modal-error" class="feedback-msg" role="alert"></p>
      </div>

      <div class="modal-footer">
        <button class="btn-secondary" onclick="cerrarModal()">Cancelar</button>
        <button class="btn-primary" id="btn-guardar" onclick="guardarDepto()">
          Guardar
        </button>
      </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
    <script src="../js/api.js"></script>
    <!-- app.js primero, luego el js de la página -->
    <script src="../js/app.js"></script>
    <script src="../js/departamentos.js"></script>
  </body>
</html>
