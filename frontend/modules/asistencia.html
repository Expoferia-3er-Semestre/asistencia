<!doctype html>
<html lang="es" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Asistencia — C.E.N. Roraima</title>
    <link rel="stylesheet" href="../css/styles.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Lora:wght@600;700&family=Source+Sans+3:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
  </head>

  <body>
    <!-- Barra superior fija -->
    <header class="topbar">
      <a class="topbar-brand" href="dashboard.html">
        <img
          src="../img/logo.svg.png"
          alt="Logo C.E.N. Roraima"
          onerror="this.style.display = 'none'"
        />
        <div class="topbar-brand-text">
          <strong>C.E.N. Roraima</strong>
          <span>Control de asistencia</span>
        </div>
      </a>

      <div class="topbar-right">
        <a href="dashboard.html" class="btn-back">← Dashboard</a>
        <a
          href="../index.html"
          class="btn-logout"
          onclick="
            logout();
            return false;
          "
        >
          Cerrar sesión
        </a>
      </div>
    </header>

    <!-- Contenido principal -->
    <main class="asist-main">
      <div class="asist-heading">
        <p class="eyebrow"></p>
        <h1>Registro de Asistencia</h1>
      </div>

      <!-- Tabla: asistencia del día -->
      <section class="tabla-panel">
        <div class="tabla-header">
          <h2>Asistencia de hoy — <span id="fecha-hoy"></span></h2>
          <div style="display: flex; align-items: center; gap: 0.75rem">
            <span class="tabla-count" id="tabla-count-hoy">0 registros</span>
            <button
              class="btn-consultar"
              id="btn-actualizar"
              onclick="cargarAsistenciaHoy()"
            >
              Actualizar
            </button>
          </div>
        </div>

        <div class="tabla-container">
          <table id="tabla-hoy">
            <thead>
              <tr>
                <th>Nombre</th>
                <th>Hora de entrada</th>
                <th>Hora de salida</th>
                <th>Estado</th>
              </tr>
            </thead>
            <tbody id="tbody-hoy">
              <tr>
                <td colspan="4" class="tabla-empty">
                  <span></span>
                  Cargando registros del día…
                </td>
              </tr>
            </tbody>
          </table>
        </div>
      </section>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
    <script src="../js/api.js"></script>
    <script src="../js/asistencia.js"></script>
  </body>
</html>
