<!doctype html>
<html lang="es" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Cargos — C.E.N. Roraima</title>
    <link rel="stylesheet" href="../css/styles.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Lora:wght@600;700&family=Source+Sans+3:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
  </head>

  <body>
    <header class="topbar">
      <a class="topbar-brand" href="dashboard.html">
        <img
          src="../img/logo_asansa.jpeg"
          alt="Logo C.E.N. Roraima"
          onerror="this.style.display = 'none'"
        />
        <div class="topbar-brand-text">
          <strong>C.E.N. Roraima</strong>
          <span>Control de asistencia</span>
        </div>
      </a>
      <div class="topbar-right">
        <a href="dashboard.html" class="btn-back">← Dashboard</a>
        <a
          href="../index.html"
          class="btn-logout"
          onclick="
            logout();
            return false;
          "
        >
          Cerrar sesión
        </a>
      </div>
    </header>

    <main class="mod-main">
      <div class="mod-heading">
        <div>
          <h1>Cargos</h1>
        </div>
        <button class="btn-primary" onclick="abrirModal()">+ Agregar</button>
      </div>

      <section class="tabla-panel">
        <div class="tabla-header">
          <h2>Listado de cargos</h2>
          <span class="tabla-count" id="tabla-count">0 cargos</span>
        </div>

        <div class="tabla-container">
          <table id="tabla-cargos">
            <thead>
              <tr>
                <th>Nombre del cargo</th>
                <th>Departamento</th>
                <th>Acciones</th>
              </tr>
            </thead>
            <tbody id="tbody-cargos">
              <tr>
                <td colspan="3">
                  <div class="tabla-empty">
                    <span>🧾</span>
                    Cargando cargos…
                  </div>
                </td>
              </tr>
            </tbody>
          </table>
        </div>
      </section>
    </main>

    <div class="modal-overlay" id="modal-overlay" onclick="cerrarModal()"></div>

    <div
      class="modal"
      id="modal-cargo"
      role="dialog"
      aria-modal="true"
      aria-labelledby="modal-titulo"
    >
      <div class="modal-header">
        <h3 id="modal-titulo">Agregar cargo</h3>
        <button class="modal-close" onclick="cerrarModal()" aria-label="Cerrar">
          ✕
        </button>
      </div>

      <div class="modal-body">
        <input type="hidden" id="form-id" />

        <label>
          Nombre del cargo
          <input type="text" id="form-nombre" placeholder="Ej: Docente" />
        </label>

        <label>
          Departamento
          <select id="form-depto">
            <option value="">Seleccionar…</option>
          </select>
        </label>

        <p id="modal-error" class="feedback-msg" role="alert"></p>
      </div>

      <div class="modal-footer">
        <button class="btn-secondary" onclick="cerrarModal()">Cancelar</button>
        <button class="btn-primary" id="btn-guardar" onclick="guardarCargo()">
          Guardar
        </button>
      </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
    <script src="../js/api.js"></script>
    <script src="../js/app.js"></script>
    <script src="../js/cargos.js"></script>
  </body>
</html>
