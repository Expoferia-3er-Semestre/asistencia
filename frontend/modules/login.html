<!doctype html>
<html lang="es" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Iniciar sesión — C.E.N. Roraima Asansa Escándela</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Lora:wght@600;700&family=Source+Sans+3:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="../css/styles.css" />
  </head>

  <body class="login-page">
    <div class="login-split">
      <!-- Panel izquierdo: imagen de fondo institucional -->
      <div class="login-panel-left">
        <div class="login-panel-overlay">
          <!-- <img
            src="../img/logo_asansa.jpeg"
            alt="Logo C.E.N. Roraima Asansa Escándela"
            class="login-side-logo"
            onerror="this.style.display = 'none'"
          />-->
          <p class="login-side-tagline">Sistema de Control de Asistencia</p>
        </div>
      </div>

      <!-- Panel derecho: formulario -->
      <div class="login-panel-right">
        <div class="login-form-container">
          <div class="login-brand">
            <img
              src="../img/logo_asansa.jpeg"
              alt="Logo institucional"
              class="login-logo"
              onerror="this.style.display = 'none'"
            />
            <h1>C.E.N. Lcda. Roraima<br />Asansa Escándela</h1>
            <p>Ingresa tus datos para continuar</p>
          </div>

          <p
            id="error-msg"
            class="error-msg"
            style="display: none"
            role="alert"
            aria-live="assertive"
          ></p>

          <div class="login-field">
            <label for="usuario">Usuario</label>
            <input
              type="text"
              id="usuario"
              name="usuario"
              placeholder="Tu nombre de usuario"
              required
              autofocus
            />
          </div>

          <div class="login-field">
            <label for="password">Contraseña</label>
            <input
              type="password"
              id="password"
              name="password"
              placeholder="Tu contraseña"
              required
            />
          </div>

          <button
            id="btn-login"
            type="button"
            onclick="iniciarSesion()"
            class="login-btn"
          >
            Iniciar sesión
          </button>
        </div>
      </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
    <script src="../js/api.js"></script>
    <script src="../js/login.js"></script>
  </body>
</html>
